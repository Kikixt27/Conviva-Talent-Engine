name: Conviva Signal — Nightly Sourcing

on:
  schedule:
    # 00:00 UTC == 08:00 Beijing time, weekdays only
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nightly-sourcing
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DS_API_KEY: ${{ secrets.DS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_SLACK_IN_ENGINE: "1"
          AI_PROVIDER: auto
          CLAUDE_MODEL: claude-haiku-4-5
          DEEPSEEK_MODEL: deepseek-chat
          SCORE_THRESHOLD: "65"
          MAX_CANDIDATES_PER_QUERY: "20"
        run: python scripts/source.py

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: signal-report
          path: reports/
          retention-days: 30

      - name: Commit updated candidate database
        run: |
          git config user.name  "conviva-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          shopt -s nullglob
          git add data/candidates.json reports/ data/roles/ pipeline/
          git add data/candidates/*.jsonl
          if [ -f feedback/summary.json ]; then git add feedback/summary.json; fi
          if git diff --cached --quiet; then
            echo "No new candidates to commit."
          else
            git commit -m "data: nightly sourcing run $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Slack + optional email with report link
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: |
          export REPORT_DATE="$(date -u +'%Y-%m-%d')"
          export REPORT_PATH="reports/${REPORT_DATE}.html"
          export DIGEST_JSON="reports/latest_digest.json"
          python scripts/notify_report.py
